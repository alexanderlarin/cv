summary:
  title: Summary
  description: |
    Engineer and technical lead. Building software since 2008, with five years leading development and teams.

    What I do best is make things work that don't work yet: research algorithms, prototypes,
    old systems people are afraid to touch. I'm not scared of someone else's legacy and I don't propose rewriting it all.
    I figure out how the system works and bring a plan to improve it without breaking it.

    I've worked in computer vision and machine learning, published in scientific journals,
    led development, and built products from scratch — from servers and mobile apps to hardware.

    I take responsibility for delivery across the full lifecycle: requirements analysis, technical decisions,
    organizing the work, implementation, deployment and ongoing development.

