summary:
  title: Обо мне
  description: |
    Инженер и технический руководитель. В разработке с 2008 года, пять лет руководил разработкой и командами.

    Лучше всего умею доводить до дела то, что пока не работает: научные алгоритмы, прототипы,
    старые системы, которые страшно трогать. Чужого унаследованного кода не боюсь и не предлагаю всё переписать.
    Разбираюсь, как система устроена, и приношу план, по которому её можно улучшать, не ломая.

    Работал с компьютерным зрением и машинным обучением, публиковался в научных журналах,
    руководил разработкой, собирал продукты с нуля — от серверов и мобильных приложений до железа.

    Отвечаю за результат целиком: от анализа требований и выбора технических решений
    до организации работы, реализации, внедрения и дальнейшего развития системы.

